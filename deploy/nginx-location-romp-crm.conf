# Step 1 — Add this block inside your existing `server { ... }` for `hromp.com`
# (the one that terminates TLS on port 443).
#
# It forwards https://hromp.com/romp-crm/... to the Phoenix app on 127.0.0.1:40175/...
# The trailing slash on `proxy_pass` strips the `/romp-crm` prefix.

location /romp-crm/ {
    proxy_pass http://127.0.0.1:40175/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
    proxy_connect_timeout 60;
    proxy_send_timeout 86400;
}
